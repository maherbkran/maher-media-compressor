<dialog id="nativeSettingsDialog" class="dialog compact" aria-labelledby="nativeSettingsTitle"><div class="dialog-pad"><div class="dialog-top"><h2 id="nativeSettingsTitle">خيارات متقدمة</h2><button class="btn close" data-close="nativeSettingsDialog"><svg class="ic"><use href="#ph-x"></use></svg>إغلاق</button></div><p class="dialog-desc">أقصى أبعاد للنتيجة، مع الحفاظ على النسبة والكادر.</p><div class="native-fields"><label>أقصى عرض<input id="nativeWidth" type="number" min="16" max="16384" step="1" dir="ltr" aria-label="أقصى عرض بالبكسل"></label><label>أقصى ارتفاع<input id="nativeHeight" type="number" min="16" max="16384" step="1" dir="ltr" aria-label="أقصى ارتفاع بالبكسل"></label></div><p class="native-note" id="nativeFormatNote"></p><div class="native-presets" id="nativePresets"><button class="btn mini" data-cap="5">5 MB</button><button class="btn mini" data-cap="10">10 MB</button><button class="btn mini" data-cap="0">بدون حد حجم</button></div><div class="native-actions"><button id="nativeApply" class="btn primary">تطبيق</button><button id="nativeReset" class="btn">الافتراضي</button><button class="btn" data-close="nativeSettingsDialog">إلغاء</button></div></div></dialog>
<dialog id="destinationDialog" class="dialog compact" aria-labelledby="destinationTitle"><div class="dialog-pad"><div class="dialog-top"><h2 id="destinationTitle">مكان الحفظ</h2><button class="btn close" data-close="destinationDialog">إغلاق</button></div><p class="dialog-desc">تُحفظ كل نتيجة كنسخة جديدة، وتبقى الأصول محفوظة.</p><label class="motion-option"><span>الحفظ بجانب كل أصل تلقائياً</span><input id="nativeAutoOutput" type="checkbox" role="switch" checked></label><p class="destination-path" id="nativeDestination" dir="auto"></p><div class="native-actions"><button class="btn" id="nativeChooseDestination"><svg class="ic"><use href="#ph-folder-open"></use></svg>اختيار مجلد آخر</button><button class="btn primary" data-close="destinationDialog">تم</button></div></div></dialog>
<dialog id="nativeCloseDialog" class="dialog compact" aria-labelledby="nativeCloseTitle"><div class="dialog-pad"><div class="dialog-top"><h2 id="nativeCloseTitle">إيقاف وإغلاق؟</h2></div><p class="dialog-desc">العمل مستمر. يمكنك متابعة اللعب أو العودة للبرنامج. الإيقاف يحتفظ بالنتائج المكتملة والأصول.</p><div class="native-actions"><button class="btn danger" id="nativeConfirmClose">إيقاف وإغلاق</button><button class="btn" data-close="nativeCloseDialog">متابعة العمل</button></div></div></dialog>
